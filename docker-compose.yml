services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: subtranslate-backend
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - WHISPER_MODEL=${WHISPER_MODEL:-tiny}
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    volumes:
      # Persist uploads, audio, subtitles and sqlite database
      - backend-storage:/app/storage
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: subtranslate-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-storage:
